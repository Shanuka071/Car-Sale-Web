<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Car Sale Web</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="page-header">
    <h1>Car Sale Web Application</h1>
    <p>Select a car, register customers, and complete purchases.</p>
  </header>

  <main class="layout">
    <section class="card">
      <h2>Add Vehicle</h2>
      <form id="vehicle-form" class="form-grid">
        <label>
          Model
          <input id="vehicle-model" name="vehicle-model" type="text" required />
        </label>
        <label>
          Brand
          <input id="vehicle-brand" name="vehicle-brand" type="text" required />
        </label>
        <label>
          Price ($)
          <input id="vehicle-price" name="vehicle-price" type="number" min="1" required />
        </label>
        <button type="submit">Save Vehicle</button>
      </form>
      <ul id="vehicle-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Add Customer</h2>
      <form id="customer-form" class="form-grid">
        <label>
          Full Name
          <input id="customer-name" name="customer-name" type="text" required />
        </label>
        <label>
          Email
          <input id="customer-email" name="customer-email" type="email" required />
        </label>
        <label>
          Phone
          <input id="customer-phone" name="customer-phone" type="tel" required />
        </label>
        <button type="submit">Save Customer</button>
      </form>
      <ul id="customer-list" class="list"></ul>
    </section>

    <section class="card">
      <h2>Buy Car</h2>
      <form id="purchase-form" class="form-grid">
        <label>
          Select Customer
          <select id="purchase-customer" required>
            <option value="">Choose a customer</option>
          </select>
        </label>
        <label>
          Select Vehicle
          <select id="purchase-vehicle" required>
            <option value="">Choose a vehicle</option>
          </select>
        </label>
        <button type="submit">Buy Vehicle</button>
      </form>
      <ul id="purchase-list" class="list"></ul>
    </section>
  </main>

  <template id="item-template">
    <li class="item"></li>
  </template>

  <script src="script.js"></script>
</body>
</html>
